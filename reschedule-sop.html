<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>Reschedule SOP Training — AC Pre-Call Training</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --slate-900: #1b2a31;
        --slate-800: #243841;
        --slate-700: #2f4a56;
        --slate-600: #3f5b68;
        --slate-500: #5a7682;
        --slate-400: #89a0ab;
        --slate-300: #b5c6cd;
        --slate-200: #dce5e9;
        --slate-100: #edf1f3;
        --teal-700: #1e8f86;
        --teal-600: #2db3a6;
        --teal-500: #4ec5b9;
        --teal-400: #87d8d0;
        --teal-200: #c9eae6;
        --teal-100: #e6f5f2;
        --paper: #f7f3ed;
        --paper-deep: #efe8dc;
        --bone: #fbf9f4;
        --ink: #1a262c;
        --ink-soft: #3d5059;
        --alert: #b8472e;
        --correct-bg: #e6f5f2;
        --correct-border: #2db3a6;
        --incorrect-bg: #fdf0ec;
        --incorrect-border: #b8472e;
        --warning: #d97706;
        --warning-bg: #fef3c7;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background: var(--paper);
        color: var(--ink);
        font-family: "IBM Plex Sans", system-ui, sans-serif;
        line-height: 1.6;
        min-height: 100vh;
      }
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        background:
          radial-gradient(
            ellipse at 20% 0%,
            rgba(45, 179, 166, 0.06) 0%,
            transparent 60%
          ),
          radial-gradient(
            ellipse at 80% 100%,
            rgba(30, 143, 134, 0.04) 0%,
            transparent 50%
          );
        pointer-events: none;
        z-index: 0;
      }
      .site-nav {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: 64px;
        background: var(--bone);
        border-bottom: 1px solid var(--slate-200);
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 40px;
        z-index: 200;
      }
      .nav-logo {
        display: flex;
        align-items: center;
        gap: 14px;
        text-decoration: none;
      }
      .nav-logo img {
        height: 36px;
        width: auto;
      }
      .nav-links {
        display: flex;
        align-items: center;
        gap: 8px;
        overflow-x: auto;
      }
      .nav-link {
        font-family: "IBM Plex Mono", monospace;
        font-size: 13px;
        font-weight: 500;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        text-decoration: none;
        color: var(--slate-500);
        padding: 8px 16px;
        border-radius: 6px;
        transition: all 0.2s ease;
        white-space: nowrap;
      }
      .nav-link:hover {
        color: var(--teal-700);
        background: var(--teal-100);
      }
      .nav-link.active {
        color: var(--teal-700);
        background: var(--teal-100);
      }
      .container {
        max-width: 820px;
        margin: 0 auto;
        padding: 100px 32px 80px;
        position: relative;
        z-index: 1;
      }
      .screen {
        display: none;
      }
      .screen.active {
        display: block;
      }
      /* XP/Streak Header */
      .xp-bar {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 32px;
        padding: 16px 0 8px;
        margin-bottom: 16px;
      }
      .xp-item {
        display: flex;
        align-items: center;
        gap: 8px;
        font-family: "IBM Plex Mono", monospace;
        font-size: 14px;
        font-weight: 500;
        color: var(--slate-600);
      }
      .xp-item .icon {
        font-size: 20px;
      }
      .xp-item .val {
        color: var(--teal-700);
        font-weight: 600;
        font-size: 16px;
      }
      /* Level Map */
      .level-path {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0;
        padding: 20px 0;
      }
      .level-row {
        display: flex;
        align-items: center;
        gap: 24px;
        padding: 12px 0;
        position: relative;
      }
      .level-row:nth-child(odd) {
        align-self: flex-start;
        margin-left: 10%;
      }
      .level-row:nth-child(even) {
        align-self: flex-end;
        margin-right: 10%;
      }
      .level-connector {
        width: 2px;
        height: 32px;
        background: var(--slate-300);
        margin: 0 auto;
      }
      .level-node {
        width: 80px;
        height: 80px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: "Outfit", sans-serif;
        font-size: 28px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
        border: 3px solid var(--slate-300);
        background: var(--bone);
        color: var(--slate-400);
        position: relative;
      }
      .level-node.unlocked {
        border-color: var(--teal-600);
        background: var(--teal-100);
        color: var(--teal-700);
      }
      .level-node.unlocked:hover {
        transform: scale(1.08);
        box-shadow: 0 8px 24px rgba(30, 143, 134, 0.15);
      }
      .level-node.completed {
        border-color: var(--teal-700);
        background: var(--teal-700);
        color: #fff;
      }
      .level-node.locked {
        cursor: not-allowed;
        opacity: 0.6;
      }
      .level-node .lock-icon {
        font-size: 24px;
      }
      .level-info {
        min-width: 200px;
      }
      .level-info h3 {
        font-family: "Outfit", sans-serif;
        font-size: 20px;
        font-weight: 500;
        color: var(--slate-800);
        line-height: 1.2;
      }
      .level-info .level-sub {
        font-size: 13px;
        color: var(--ink-soft);
        margin-top: 4px;
      }
      .stars-row {
        display: flex;
        gap: 4px;
        margin-top: 8px;
      }
      .stars-row .star {
        font-size: 18px;
        color: var(--slate-300);
      }
      .stars-row .star.earned {
        color: #f59e0b;
      }
      /* Level Intro */
      .intro-card {
        text-align: center;
        padding-top: 60px;
      }
      .intro-eyebrow {
        font-family: "IBM Plex Mono", monospace;
        font-size: 14px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--teal-700);
        font-weight: 500;
        margin-bottom: 16px;
      }
      .intro-title {
        font-family: "Outfit", sans-serif;
        font-size: 44px;
        font-weight: 500;
        letter-spacing: -0.025em;
        color: var(--slate-800);
        margin-bottom: 16px;
        line-height: 1.1;
      }
      .intro-desc {
        font-size: 17px;
        color: var(--ink-soft);
        max-width: 520px;
        margin: 0 auto 32px;
        line-height: 1.55;
      }
      .intro-meta {
        display: flex;
        justify-content: center;
        gap: 40px;
        margin-bottom: 40px;
      }
      .intro-meta-item {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
      }
      .intro-meta-num {
        font-family: "Outfit", sans-serif;
        font-size: 32px;
        font-weight: 400;
        color: var(--slate-800);
      }
      .intro-meta-label {
        font-family: "IBM Plex Mono", monospace;
        font-size: 11px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--slate-500);
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        padding: 16px 40px;
        border: none;
        border-radius: 8px;
        font-family: "IBM Plex Sans", system-ui, sans-serif;
        font-size: 17px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s ease;
      }
      .btn-primary {
        background: var(--teal-700);
        color: #fff;
      }
      .btn-primary:hover {
        background: var(--teal-600);
        transform: translateY(-1px);
        box-shadow: 0 4px 16px rgba(30, 143, 134, 0.3);
      }
      .btn-ghost {
        background: transparent;
        color: var(--slate-500);
        border: 1px solid var(--slate-300);
      }
      .btn-ghost:hover {
        background: var(--slate-100);
        color: var(--slate-700);
      }
      .btn:disabled {
        opacity: 0.4;
        cursor: not-allowed;
        transform: none !important;
        box-shadow: none !important;
      }
      /* Progress Bar */
      .progress-bar {
        display: flex;
        align-items: center;
        gap: 16px;
        margin-bottom: 28px;
      }
      .progress-track {
        flex: 1;
        height: 6px;
        background: var(--slate-200);
        border-radius: 3px;
        overflow: hidden;
      }
      .progress-fill {
        height: 100%;
        background: linear-gradient(90deg, var(--teal-700), var(--teal-500));
        border-radius: 3px;
        transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
      }
      .progress-label {
        font-family: "IBM Plex Mono", monospace;
        font-size: 13px;
        color: var(--slate-500);
        white-space: nowrap;
      }
      /* Question Card */
      .question-card {
        animation: fadeSlideIn 0.4s ease;
      }
      @keyframes fadeSlideIn {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .question-text {
        font-family: "Outfit", sans-serif;
        font-size: 24px;
        font-weight: 500;
        color: var(--slate-800);
        line-height: 1.3;
        margin-bottom: 24px;
        letter-spacing: -0.01em;
      }
      /* MC/TF Options */
      .options-list {
        display: flex;
        flex-direction: column;
        gap: 10px;
        margin-bottom: 24px;
      }
      .option {
        display: flex;
        align-items: flex-start;
        gap: 14px;
        padding: 16px 20px;
        background: #fff;
        border: 2px solid var(--slate-200);
        border-radius: 8px;
        cursor: pointer;
        transition: all 0.15s ease;
        font-size: 15px;
        line-height: 1.5;
      }
      .option:hover {
        border-color: var(--teal-500);
        background: var(--teal-100);
      }
      .option.selected {
        border-color: var(--teal-600);
        background: var(--teal-100);
      }
      .option.disabled {
        pointer-events: none;
      }
      .option.correct-answer {
        border-color: var(--correct-border);
        background: var(--correct-bg);
      }
      .option.incorrect-answer {
        border-color: var(--incorrect-border);
        background: var(--incorrect-bg);
      }
      .option-letter {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 32px;
        height: 32px;
        min-width: 32px;
        border-radius: 50%;
        border: 2px solid var(--slate-300);
        font-family: "IBM Plex Mono", monospace;
        font-size: 14px;
        font-weight: 500;
        color: var(--slate-500);
        transition: all 0.15s;
      }
      .option.selected .option-letter {
        border-color: var(--teal-600);
        background: var(--teal-600);
        color: #fff;
      }
      .option.correct-answer .option-letter {
        border-color: var(--correct-border);
        background: var(--correct-border);
        color: #fff;
      }
      .option.incorrect-answer .option-letter {
        border-color: var(--incorrect-border);
        background: var(--incorrect-border);
        color: #fff;
      }
      .option-text {
        flex: 1;
        color: var(--ink);
      }
      /* ORDER type */
      .order-items {
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin-bottom: 24px;
      }
      .order-item {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 14px 18px;
        background: #fff;
        border: 2px solid var(--slate-200);
        border-radius: 8px;
        cursor: pointer;
        transition: all 0.15s;
        font-size: 15px;
      }
      .order-item:hover {
        border-color: var(--teal-400);
      }
      .order-item.picked {
        border-color: var(--teal-600);
        background: var(--teal-100);
      }
      .order-item.disabled {
        pointer-events: none;
      }
      .order-item.correct-pos {
        border-color: var(--correct-border);
        background: var(--correct-bg);
      }
      .order-item.incorrect-pos {
        border-color: var(--incorrect-border);
        background: var(--incorrect-bg);
      }
      .order-num {
        width: 28px;
        height: 28px;
        min-width: 28px;
        border-radius: 50%;
        background: var(--slate-200);
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: "IBM Plex Mono", monospace;
        font-size: 13px;
        font-weight: 600;
        color: var(--slate-500);
        transition: all 0.15s;
      }
      .order-item.picked .order-num {
        background: var(--teal-600);
        color: #fff;
      }
      /* TREE scenario */
      .scenario-header {
        background: var(--slate-800);
        color: var(--slate-100);
        border-radius: 10px;
        padding: 20px 24px;
        margin-bottom: 20px;
        font-size: 14px;
        line-height: 1.6;
      }
      .scenario-header .sh-label {
        font-family: "IBM Plex Mono", monospace;
        font-size: 10px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--teal-400);
        margin-bottom: 8px;
      }
      .scenario-header .sh-client {
        font-family: "Outfit", sans-serif;
        font-size: 20px;
        font-weight: 500;
        color: #fff;
        margin-bottom: 4px;
      }
      .scenario-header .sh-details {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        font-size: 13px;
        color: var(--slate-300);
      }
      .scenario-header .sh-details span {
        background: rgba(255, 255, 255, 0.08);
        padding: 3px 10px;
        border-radius: 12px;
      }
      .sys-pill {
        display: inline-block;
        padding: 6px 14px;
        border-radius: 20px;
        font-family: "IBM Plex Mono", monospace;
        font-size: 12px;
        background: var(--paper-deep);
        color: var(--ink-soft);
        margin-bottom: 16px;
      }
      .transcript {
        margin-bottom: 20px;
      }
      .transcript-msg {
        padding: 10px 16px;
        border-radius: 8px;
        margin-bottom: 8px;
        font-size: 14px;
        line-height: 1.5;
      }
      .transcript-msg.client {
        background: #fff;
        border: 1px solid var(--slate-200);
        border-left: 3px solid #1565c0;
      }
      .transcript-msg.ac {
        background: var(--teal-100);
        border: 1px solid var(--teal-200);
        border-left: 3px solid var(--teal-600);
      }
      .transcript-msg .msg-who {
        font-family: "IBM Plex Mono", monospace;
        font-size: 11px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--slate-400);
        margin-bottom: 4px;
      }
      /* Consequence Interlude */
      .consequence {
        padding: 20px 24px;
        border-radius: 10px;
        margin: 16px 0;
        border-left: 4px solid;
        animation: fadeSlideIn 0.4s ease;
      }
      .consequence.severity-red {
        border-color: var(--alert);
        background: var(--incorrect-bg);
      }
      .consequence.severity-amber {
        border-color: var(--warning);
        background: var(--warning-bg);
      }
      .consequence .con-icon {
        font-size: 24px;
        margin-bottom: 8px;
      }
      .consequence .con-title {
        font-family: "Outfit", sans-serif;
        font-size: 18px;
        font-weight: 600;
        margin-bottom: 8px;
      }
      .consequence.severity-red .con-title {
        color: var(--alert);
      }
      .consequence.severity-amber .con-title {
        color: var(--warning);
      }
      .consequence .con-narrative {
        font-size: 14px;
        line-height: 1.6;
        color: var(--ink-soft);
      }
      /* Feedback */
      .feedback-panel {
        margin-top: 20px;
        padding: 20px 24px;
        border-radius: 8px;
        border-left: 4px solid;
        animation: fadeSlideIn 0.3s ease;
      }
      .feedback-panel.correct {
        border-color: var(--correct-border);
        background: var(--correct-bg);
      }
      .feedback-panel.incorrect {
        border-color: var(--incorrect-border);
        background: var(--incorrect-bg);
      }
      .feedback-panel .fb-title {
        font-family: "Outfit", sans-serif;
        font-size: 18px;
        font-weight: 600;
        margin-bottom: 6px;
      }
      .feedback-panel.correct .fb-title {
        color: var(--teal-700);
      }
      .feedback-panel.incorrect .fb-title {
        color: var(--alert);
      }
      .feedback-panel .fb-text {
        font-size: 14px;
        line-height: 1.55;
        color: var(--ink-soft);
      }
      .action-row {
        display: flex;
        justify-content: center;
        gap: 16px;
        margin-top: 24px;
      }
      /* Level Complete */
      .complete-card {
        text-align: center;
        padding-top: 40px;
      }
      .stars-big {
        display: flex;
        justify-content: center;
        gap: 12px;
        margin-bottom: 24px;
      }
      .stars-big .star-big {
        font-size: 48px;
        color: var(--slate-300);
        transition: all 0.4s ease;
      }
      .stars-big .star-big.earned {
        color: #f59e0b;
        animation: starPop 0.5s ease;
      }
      @keyframes starPop {
        0% {
          transform: scale(0);
          opacity: 0;
        }
        60% {
          transform: scale(1.3);
        }
        100% {
          transform: scale(1);
          opacity: 1;
        }
      }
      .complete-score {
        font-family: "Outfit", sans-serif;
        font-size: 56px;
        font-weight: 400;
        color: var(--slate-800);
        margin-bottom: 8px;
      }
      .complete-pct {
        font-family: "IBM Plex Mono", monospace;
        font-size: 16px;
        color: var(--slate-500);
        margin-bottom: 24px;
      }
      .xp-earned {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 10px 24px;
        border-radius: 20px;
        background: var(--teal-100);
        color: var(--teal-700);
        font-family: "IBM Plex Mono", monospace;
        font-size: 15px;
        font-weight: 600;
        margin-bottom: 32px;
      }
      /* Responsive */
      @media (max-width: 720px) {
        .site-nav {
          padding: 0 16px;
        }
        .nav-links {
          gap: 4px;
        }
        .nav-link {
          padding: 6px 10px;
          font-size: 11px;
        }
        .container {
          padding: 80px 16px 60px;
        }
        .intro-title {
          font-size: 32px;
        }
        .question-text {
          font-size: 20px;
        }
        .level-row:nth-child(odd),
        .level-row:nth-child(even) {
          margin-left: 0;
          margin-right: 0;
          align-self: center;
        }
        .level-info h3 {
          font-size: 17px;
        }
        .scenario-header .sh-details {
          flex-direction: column;
          gap: 6px;
        }
        .intro-meta {
          gap: 24px;
        }
        .intro-meta-num {
          font-size: 26px;
        }
      }
    </style>
  </head>
  <body>
    <nav class="site-nav">
      <a href="index.html" class="nav-logo"
        ><img src="logo.png" alt="Dr. Pompa"
      /></a>
      <div class="nav-links">
        <a href="index.html" class="nav-link">Home</a>
        <a href="quiz.html" class="nav-link">Quiz</a>
        <a href="simulator.html" class="nav-link">Simulator</a>
        <a href="live-testing.html" class="nav-link">Live Testing</a>
        <a href="contacts.html" class="nav-link">Contacts</a>
        <a href="call-scripts.html" class="nav-link">Call Scripts</a>
        <a href="spouse-training.html" class="nav-link">Spouse</a>
        <a href="call-guide.html" class="nav-link">Call Guide</a>
        <a href="reschedule-sop.html" class="nav-link active">Reschedule SOP</a>
      </div>
    </nav>
    <div class="container">
      <div id="levelMap" class="screen active"></div>
      <div id="levelIntro" class="screen"></div>
      <div id="questionScreen" class="screen"></div>
      <div id="levelComplete" class="screen"></div>
    </div>
    <script>
      (function () {
        "use strict";
        var LS_KEY = "ac-reschedule-sop";
        var XP_PER_LEVEL = [25, 35, 40, 50];
        var BONUS_PER_LEVEL = [100, 150, 200, 250];
        var UNLOCK_GATES = [0, 75, 70, 70];

        var LEVELS = [
          {
            id: 1,
            title: "The Rules",
            description:
              "Core reschedule rules, calendar standards, and priority order. Master the fundamentals before handling real scenarios.",
            questions: [
              {
                type: "MC",
                question:
                  "A client wants to reschedule their consultation. What is the #1 priority when offering new times?",
                options: [
                  "Find the earliest available slot with any HA",
                  "Keep the client with their SAME Health Advisor",
                  "Offer only times within the same week",
                  "Let the client pick from the full round-robin calendar",
                ],
                correct: 1,
                explanation:
                  "Same-HA priority is the #1 rule. The client has been prepped for a specific HA. Switching HAs means losing context and rapport built during onboarding.",
              },
              {

        var LETTERS = ["A", "B", "C", "D"];
        function el(id) {
          return document.getElementById(id);
        }
        function ce(tag, cls, txt) {
          var e = document.createElement(tag);
          if (cls) e.className = cls;
          if (txt) e.textContent = txt;
          return e;
        }
        function clr(n) {
          while (n.firstChild) n.removeChild(n.firstChild);
        }

        /* ── localStorage ── */
        function loadData() {
          try {
            return JSON.parse(localStorage.getItem(LS_KEY)) || initData();
          } catch (e) {
            return initData();
          }
        }
        function initData() {
          var d = {
            levels: {},
            totalXP: 0,
            streak: { current: 0, lastDate: null },
          };
          LEVELS.forEach(function (lv) {
            d.levels[lv.id] = {
              bestScore: 0,
              totalQuestions: lv.questions.length,
              bestPercent: 0,
              attempts: 0,
              lastAttempt: null,
            };
          });
          return d;
        }
        function saveData(d) {
          try {
            localStorage.setItem(LS_KEY, JSON.stringify(d));
          } catch (e) {}
        }
        var data = loadData();

        /* ── Streak ── */
        function updateStreak() {
          var today = new Date().toISOString().slice(0, 10);
          if (data.streak.lastDate === today) return;
          if (data.streak.lastDate) {
            var last = new Date(data.streak.lastDate);
            var now = new Date(today);
            var diff = Math.floor((now - last) / (1000 * 60 * 60 * 24));
            if (diff === 1) data.streak.current++;
            else if (diff > 1) data.streak.current = 1;
          } else {
            data.streak.current = 1;
          }
          data.streak.lastDate = today;
          saveData(data);
        }

        /* ── State ── */
        var currentLevel = null,
          currentQ = 0,
          score = 0,
          treeCorrect = true,
          selectedOpt = null,
          orderPicks = [];
        var inConsequence = false;

        /* ── Screen switching ── */
        function showScreen(id) {
          ["levelMap", "levelIntro", "questionScreen", "levelComplete"].forEach(
            function (s) {
              el(s).classList.remove("active");
            },
          );
          el(id).classList.add("active");
        }

        /* ── Level Map ── */
        function renderLevelMap() {
          var c = el("levelMap");
          clr(c);
          var bar = ce("div", "xp-bar");
          bar.innerHTML =
            '<div class="xp-item"><span class="icon">\u26A1</span> <span class="val">' +
            data.totalXP +
            '</span> XP</div><div class="xp-item"><span class="icon">\uD83D\uDD25</span> <span class="val">' +
            data.streak.current +
            "</span> day streak</div>";
          c.appendChild(bar);
          var title = ce("div", "");
          title.style.cssText = "text-align:center;margin-bottom:32px";
          title.innerHTML =
            '<div style="font-family:IBM Plex Mono,monospace;font-size:14px;letter-spacing:.18em;text-transform:uppercase;color:var(--teal-700);font-weight:500;margin-bottom:12px">SOP TRAINING</div><div style="font-family:Outfit,sans-serif;font-size:44px;font-weight:500;color:var(--slate-800);letter-spacing:-.025em">Reschedule SOP</div>';
          c.appendChild(title);
          var path = ce("div", "level-path");
          LEVELS.forEach(function (lv, i) {
            if (i > 0) {
              var conn = ce("div", "level-connector");
              path.appendChild(conn);
            }
            var row = ce("div", "level-row");
            var ld = data.levels[lv.id];
            var unlocked =
              i === 0 ||
              data.levels[LEVELS[i - 1].id].bestPercent >= UNLOCK_GATES[i];
            var completed = ld.bestPercent > 0;
            var node = ce(
              "div",
              "level-node" +
                (unlocked
                  ? completed
                    ? " completed"
                    : " unlocked"
                  : " locked"),
            );
            if (unlocked) {
              node.textContent = lv.id;
            } else {
              node.innerHTML = '<span class="lock-icon">\uD83D\uDD12</span>';
            }
            if (unlocked)
              node.addEventListener("click", function () {
                showLevelIntro(lv.id);
              });
            row.appendChild(node);
            var info = ce("div", "level-info");
            info.innerHTML =
              "<h3>" +
              lv.title +
              '</h3><div class="level-sub">' +
              lv.questions.length +
              " questions" +
              (ld.bestPercent > 0
                ? " \u00B7 Best: " + ld.bestPercent + "%"
                : "") +
              "</div>";
            var stars = ce("div", "stars-row");
            var numStars = getStars(ld.bestPercent);
            for (var s = 0; s < 3; s++) {
              var st = ce("span", "star" + (s < numStars ? " earned" : ""));
              st.textContent = "\u2B50";
              stars.appendChild(st);
            }
            info.appendChild(stars);
            if (!unlocked) {
              var req = ce("div", "");
              req.style.cssText =
                "font-size:12px;color:var(--slate-400);margin-top:4px;font-family:IBM Plex Mono,monospace";
              req.textContent =
                "Requires Level " + i + " \u2265 " + UNLOCK_GATES[i] + "%";
              info.appendChild(req);
            }
            row.appendChild(info);
            path.appendChild(row);
          });
          c.appendChild(path);
        }

        function getStars(pct) {
          if (pct >= 90) return 3;
          if (pct >= 75) return 2;
          if (pct >= 50) return 1;
          return 0;
        }

        /* ── Level Intro ── */
        function showLevelIntro(lvId) {
          currentLevel = lvId;
          var lv = LEVELS[lvId - 1];
          var ld = data.levels[lvId];
          var c = el("levelIntro");
          clr(c);
          var card = ce("div", "intro-card");
          card.innerHTML =
            '<div class="intro-eyebrow">LEVEL ' +
            lvId +
            '</div><div class="intro-title">' +
            lv.title +
            '</div><div class="intro-desc">' +
            lv.description +
            "</div>";
          var meta = ce("div", "intro-meta");
          meta.innerHTML =
            '<div class="intro-meta-item"><div class="intro-meta-num">' +
            lv.questions.length +
            '</div><div class="intro-meta-label">Questions</div></div><div class="intro-meta-item"><div class="intro-meta-num">' +
            (ld.bestPercent > 0 ? ld.bestPercent + "%" : "\u2014") +
            '</div><div class="intro-meta-label">Best Score</div></div><div class="intro-meta-item"><div class="intro-meta-num">' +
            ld.attempts +
            '</div><div class="intro-meta-label">Attempts</div></div>';
          card.appendChild(meta);
          var startBtn = ce("button", "btn btn-primary", "Start Level");
          startBtn.addEventListener("click", function () {
            startLevel(lvId);
          });
          card.appendChild(startBtn);
          var backBtn = ce("button", "btn btn-ghost", "Back to Map");
          backBtn.style.marginLeft = "12px";
          backBtn.addEventListener("click", function () {
            showScreen("levelMap");
            renderLevelMap();
          });
          card.appendChild(backBtn);
          c.appendChild(card);
          showScreen("levelIntro");
        }

        /* ── Start Level ── */
        function startLevel(lvId) {
          currentLevel = lvId;
          currentQ = 0;
          score = 0;
          showScreen("questionScreen");
          renderQuestion();
        }

        /* ── Render Question ── */
        function renderQuestion() {
          var lv = LEVELS[currentLevel - 1];
          if (currentQ >= lv.questions.length) {
            finishLevel();
            return;
          }
          var q = lv.questions[currentQ];
          var c = el("questionScreen");
          clr(c);
          selectedOpt = null;
          orderPicks = [];
          treeCorrect = true;
          inConsequence = false;
          // Progress bar
          var pb = ce("div", "progress-bar");
          var pct = Math.round((currentQ / lv.questions.length) * 100);
          pb.innerHTML =
            '<div class="progress-track"><div class="progress-fill" style="width:' +
            pct +
            '%"></div></div><div class="progress-label">' +
            currentQ +
            " / " +
            lv.questions.length +
            "</div>";
          c.appendChild(pb);
          var card = ce("div", "question-card");
          if (q.type === "TREE") renderTree(card, q);
          else if (q.type === "ORDER") renderOrder(card, q);
          else renderMCTF(card, q);
          c.appendChild(card);
        }

        /* ── MC / TF ── */
        function renderMCTF(card, q) {
          card.appendChild(ce("div", "question-text", q.question));
          var opts = ce("div", "options-list");
          var choices = q.type === "TF" ? ["True", "False"] : q.options;
          choices.forEach(function (txt, i) {
            var opt = ce("div", "option");
            var letter = ce(
              "div",
              "option-letter",
              q.type === "TF" ? (i === 0 ? "T" : "F") : LETTERS[i],
            );
            var text = ce("div", "option-text", txt);
            opt.appendChild(letter);
            opt.appendChild(text);
            opt.addEventListener("click", function () {
              if (opt.classList.contains("disabled")) return;
              opts.querySelectorAll(".option").forEach(function (o) {
                o.classList.remove("selected");
              });
              opt.classList.add("selected");
              selectedOpt = i;
              submitBtn.disabled = false;
            });
            opts.appendChild(opt);
          });
          card.appendChild(opts);
          var row = ce("div", "action-row");
          var submitBtn = ce("button", "btn btn-primary", "Submit");
          submitBtn.disabled = true;
          submitBtn.addEventListener("click", function () {
            submitMCTF(card, q, opts, submitBtn);
          });
          row.appendChild(submitBtn);
          card.appendChild(row);
        }

        function submitMCTF(card, q, opts, submitBtn) {
          submitBtn.disabled = true;
          var correctIdx = q.type === "TF" ? (q.correct ? 0 : 1) : q.correct;
          var isCorrect = selectedOpt === correctIdx;
          if (isCorrect) score++;
          opts.querySelectorAll(".option").forEach(function (o, i) {
            o.classList.add("disabled");
            if (i === correctIdx) o.classList.add("correct-answer");
            if (i === selectedOpt && !isCorrect)
              o.classList.add("incorrect-answer");
          });
          var fb = ce(
            "div",
            "feedback-panel " + (isCorrect ? "correct" : "incorrect"),
          );
          fb.innerHTML =
            '<div class="fb-title">' +
            (isCorrect ? "\u2705 Correct!" : "\u274C Incorrect") +
            '</div><div class="fb-text">' +
            q.explanation +
            "</div>";
          card.appendChild(fb);
          var row = ce("div", "action-row");
          var nextBtn = ce("button", "btn btn-primary", "Next");
          nextBtn.addEventListener("click", function () {
            currentQ++;
            renderQuestion();
          });
          row.appendChild(nextBtn);
          card.appendChild(row);
        }

        /* ── ORDER ── */
        function renderOrder(card, q) {
          card.appendChild(ce("div", "question-text", q.question));
          var hint = ce("div", "");
          hint.style.cssText =
            "font-size:13px;color:var(--slate-500);margin-bottom:16px;font-family:IBM Plex Mono,monospace";
          hint.textContent =
            "Tap items in the correct order (1st, 2nd, 3rd...)";
          card.appendChild(hint);
          var items = ce("div", "order-items");
          q.items.forEach(function (txt, i) {
            var item = ce("div", "order-item");
            var num = ce("div", "order-num", "\u00B7");
            var text = ce("div", "option-text", txt);
            item.appendChild(num);
            item.appendChild(text);
            item.dataset.idx = i;
            item.addEventListener("click", function () {
              if (item.classList.contains("disabled")) return;
              var pos = orderPicks.indexOf(i);
              if (pos > -1) {
                orderPicks.splice(pos, 1);
                item.classList.remove("picked");
              } else {
                orderPicks.push(i);
                item.classList.add("picked");
              }
              updateOrderNums(items);
              submitBtn.disabled = orderPicks.length !== q.items.length;
            });
            items.appendChild(item);
          });
          card.appendChild(items);
          var row = ce("div", "action-row");
          var submitBtn = ce("button", "btn btn-primary", "Submit");
          submitBtn.disabled = true;
          submitBtn.addEventListener("click", function () {
            submitOrder(card, q, items, submitBtn);
          });
          row.appendChild(submitBtn);
          card.appendChild(row);
        }

        function updateOrderNums(items) {
          items.querySelectorAll(".order-item").forEach(function (item) {
            var idx = parseInt(item.dataset.idx);
            var num = item.querySelector(".order-num");
            var pos = orderPicks.indexOf(idx);
            num.textContent = pos > -1 ? pos + 1 : "\u00B7";
          });
        }

        function submitOrder(card, q, items, submitBtn) {
          submitBtn.disabled = true;
          var isCorrect = true;
          for (var i = 0; i < q.correctOrder.length; i++) {
            if (orderPicks[i] !== q.correctOrder[i]) {
              isCorrect = false;
              break;
            }
          }
          if (isCorrect) score++;
          items.querySelectorAll(".order-item").forEach(function (item) {
            item.classList.add("disabled");
            var idx = parseInt(item.dataset.idx);
            var userPos = orderPicks.indexOf(idx);
            var correctPos = q.correctOrder.indexOf(idx);
            if (userPos === correctPos) item.classList.add("correct-pos");
            else item.classList.add("incorrect-pos");
            var num = item.querySelector(".order-num");
            num.textContent = correctPos + 1;
          });
          var fb = ce(
            "div",
            "feedback-panel " + (isCorrect ? "correct" : "incorrect"),
          );
          fb.innerHTML =
            '<div class="fb-title">' +
            (isCorrect ? "\u2705 Correct order!" : "\u274C Wrong order") +
            '</div><div class="fb-text">' +
            q.explanation +
            "</div>";
          card.appendChild(fb);
          var row = ce("div", "action-row");
          var nextBtn = ce("button", "btn btn-primary", "Next");
          nextBtn.addEventListener("click", function () {
            currentQ++;
            renderQuestion();
          });
          row.appendChild(nextBtn);
          card.appendChild(row);
        }

        /* ── TREE ── */
        function renderTree(card, q) {
          var sc = q.scenario;
          var hdr = ce("div", "scenario-header");
          hdr.innerHTML =
            '<div class="sh-label">SCENARIO</div><div class="sh-client">' +
            sc.client +
            '</div><div class="sh-details"><span>HA: ' +
            sc.ha +
            "</span><span>" +
            sc.appointment +
            "</span><span>" +
            sc.dealStage +
            "</span></div>";
          card.appendChild(hdr);
          var pill = ce("div", "sys-pill", sc.systemState);
          card.appendChild(pill);
          renderTreeStep(card, q, 0, []);
        }

        function renderTreeStep(card, q, stepIdx, transcriptMsgs) {
          if (stepIdx >= q.steps.length) {
            // Tree complete
            if (treeCorrect) score++;
            var fb = ce(
              "div",
              "feedback-panel " + (treeCorrect ? "correct" : "incorrect"),
            );
            fb.innerHTML =
              '<div class="fb-title">' +
              (treeCorrect
                ? "\u2705 Scenario complete \u2014 perfect!"
                : "\u274C Scenario complete \u2014 some missteps") +
              '</div><div class="fb-text">Review the consequences above to reinforce the correct actions.</div>';
            card.appendChild(fb);
            var row = ce("div", "action-row");
            var nextBtn = ce("button", "btn btn-primary", "Next");
            nextBtn.addEventListener("click", function () {
              currentQ++;
              renderQuestion();
            });
            row.appendChild(nextBtn);
            card.appendChild(row);
            return;
          }
          var step = q.steps[stepIdx];
          // Add transcript
          var newMsgs = step.transcript.split("\n");
          newMsgs.forEach(function (msg) {
            msg = msg.trim();
            if (!msg) return;
            transcriptMsgs.push(msg);
          });
          // Remove old transcript+prompt+options
          var oldT = card.querySelector(".transcript");
          if (oldT) oldT.remove();
          var oldP = card.querySelector(".tree-prompt");
          if (oldP) oldP.remove();
          var oldO = card.querySelector(".tree-options");
          if (oldO) oldO.remove();
          var oldR = card.querySelector(".action-row");
          if (oldR) oldR.remove();
          var oldC = card.querySelector(".consequence");
          if (oldC) oldC.remove();

          var trans = ce("div", "transcript");
          transcriptMsgs.forEach(function (msg) {
            var isClient =
              msg.indexOf("You:") === -1 && msg.indexOf("You ") === -1;
            if (msg.startsWith("You:")) isClient = false;
            var bubble = ce(
              "div",
              "transcript-msg " + (isClient ? "client" : "ac"),
            );
            bubble.innerHTML =
              '<div class="msg-who">' +
              (isClient ? "Client" : "You") +
              "</div>" +
              msg.replace(
                /^(You:|Marcus:|Priya:|Tom:|Keisha:|Derek:|Amanda:|Jordan:|Rachel:|David:)\s*/,
                "",
              );
            trans.appendChild(bubble);
          });
          card.appendChild(trans);

          var prompt = ce("div", "tree-prompt");
          prompt.appendChild(ce("div", "question-text", step.prompt));
          card.appendChild(prompt);

          var opts = ce("div", "tree-options options-list");
          step.options.forEach(function (opt, i) {
            var el = ce("div", "option");
            var letter = ce("div", "option-letter", LETTERS[i]);
            var text = ce("div", "option-text", opt.text);
            el.appendChild(letter);
            el.appendChild(text);
            el.addEventListener("click", function () {
              if (el.classList.contains("disabled")) return;
              // Disable all
              opts.querySelectorAll(".option").forEach(function (o) {
                o.classList.add("disabled");
              });
              if (opt.correct) {
                el.classList.add("correct-answer");
                // Add to transcript and move to next step
                transcriptMsgs.push("You: " + opt.text);
                setTimeout(function () {
                  renderTreeStep(card, q, stepIdx + 1, transcriptMsgs);
                }, 400);
              } else {
                treeCorrect = false;
                el.classList.add("incorrect-answer");
                // Find correct
                step.options.forEach(function (o2, j) {
                  if (o2.correct)
                    opts.children[j].classList.add("correct-answer");
                });
                // Show consequence
                if (opt.consequence) {
                  var con = ce(
                    "div",
                    "consequence severity-" + opt.consequence.severity,
                  );
                  con.innerHTML =
                    '<div class="con-icon">' +
                    (opt.consequence.severity === "red"
                      ? "\u26D4"
                      : "\u26A0\uFE0F") +
                    '</div><div class="con-title">' +
                    opt.consequence.title +
                    '</div><div class="con-narrative">' +
                    opt.consequence.narrative +
                    "</div>";
                  card.appendChild(con);
                }
                var row = ce("div", "action-row");
                var contBtn = ce("button", "btn btn-primary", "Continue");
                contBtn.addEventListener("click", function () {
                  // Find the correct option text for transcript
                  var correctText = "";
                  step.options.forEach(function (o2) {
                    if (o2.correct) correctText = o2.text;
                  });
                  transcriptMsgs.push("You: " + correctText);
                  var oldCon = card.querySelector(".consequence");
                  if (oldCon) oldCon.remove();
                  row.remove();
                  renderTreeStep(card, q, stepIdx + 1, transcriptMsgs);
                });
                row.appendChild(contBtn);
                card.appendChild(row);
              }
            });
            opts.appendChild(el);
          });
          card.appendChild(opts);
          // Scroll to bottom
          window.scrollTo({
            top: document.body.scrollHeight,
            behavior: "smooth",
          });
        }

        /* ── Level Complete ── */
        function finishLevel() {
          updateStreak();
          var lv = LEVELS[currentLevel - 1];
          var total = lv.questions.length;
          var pct = Math.round((score / total) * 100);
          var stars = getStars(pct);
          var xpBase = score * XP_PER_LEVEL[currentLevel - 1];
          var bonus = BONUS_PER_LEVEL[currentLevel - 1];
          var multiplier = pct === 100 ? 2 : 1;
          var xpEarned = (xpBase + bonus) * multiplier;
          // Update data
          var ld = data.levels[currentLevel];
          ld.attempts++;
          ld.lastAttempt = new Date().toISOString().slice(0, 10);
          if (pct > ld.bestPercent) {
            ld.bestScore = score;
            ld.bestPercent = pct;
          }
          data.totalXP += xpEarned;
          saveData(data);
          // Render
          var c = el("levelComplete");
          clr(c);
          var card = ce("div", "complete-card");
          var starsDiv = ce("div", "stars-big");
          for (var i = 0; i < 3; i++) {
            var s = ce("span", "star-big" + (i < stars ? " earned" : ""));
            s.textContent = "\u2B50";
            if (i < stars) s.style.animationDelay = i * 0.2 + "s";
            starsDiv.appendChild(s);
          }
          card.appendChild(starsDiv);
          card.appendChild(ce("div", "complete-score", score + " / " + total));
          card.appendChild(
            ce(
              "div",
              "complete-pct",
              pct + "%" + (pct === 100 ? " \u2014 PERFECT!" : ""),
            ),
          );
          var xpBadge = ce(
            "div",
            "xp-earned",
            "\u26A1 +" +
              xpEarned +
              " XP" +
              (multiplier === 2 ? " (2x bonus!)" : ""),
          );
          card.appendChild(xpBadge);
          var row = ce("div", "action-row");
          var retryBtn = ce("button", "btn btn-ghost", "Retry Level");
          retryBtn.addEventListener("click", function () {
            startLevel(currentLevel);
          });
          row.appendChild(retryBtn);
          // Next level button if applicable
          if (currentLevel < 4) {
            var nextLvIdx = currentLevel; // 0-indexed for LEVELS array: current is currentLevel-1, next is currentLevel
            var gate = UNLOCK_GATES[nextLvIdx];
            var unlocked = pct >= gate;
            var nextBtn = ce(
              "button",
              "btn btn-primary",
              unlocked
                ? "Next Level"
                : "Need " + gate + "% to unlock Level " + (currentLevel + 1),
            );
            nextBtn.disabled = !unlocked;
            if (unlocked)
              nextBtn.addEventListener("click", function () {
                showLevelIntro(currentLevel + 1);
              });
            row.appendChild(nextBtn);
          }
          var mapBtn = ce("button", "btn btn-ghost", "Back to Map");
          mapBtn.addEventListener("click", function () {
            showScreen("levelMap");
            renderLevelMap();
          });
          row.appendChild(mapBtn);
          card.appendChild(row);
          c.appendChild(card);
          showScreen("levelComplete");
        }

        /* ── Init ── */
        renderLevelMap();
      })();
    </script>
  </body>
</html>
