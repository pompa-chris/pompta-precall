<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Call Scripts — AC Pre-Call Training</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --slate-900: #1b2a31;
        --slate-800: #243841;
        --slate-700: #2f4a56;
        --slate-600: #3f5b68;
        --slate-500: #5a7682;
        --slate-400: #89a0ab;
        --slate-300: #b5c6cd;
        --slate-200: #dce5e9;
        --slate-100: #edf1f3;
        --teal-700: #1e8f86;
        --teal-600: #2db3a6;
        --teal-500: #4ec5b9;
        --teal-400: #87d8d0;
        --teal-200: #c9eae6;
        --teal-100: #e6f5f2;
        --paper: #f7f3ed;
        --paper-deep: #efe8dc;
        --bone: #fbf9f4;
        --ink: #1a262c;
        --ink-soft: #3d5059;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background: var(--paper);
        color: var(--ink);
        font-family: "IBM Plex Sans", system-ui, sans-serif;
        line-height: 1.6;
        min-height: 100vh;
      }
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        background:
          radial-gradient(
            ellipse at 20% 0%,
            rgba(45, 179, 166, 0.06) 0%,
            transparent 60%
          ),
          radial-gradient(
            ellipse at 80% 100%,
            rgba(30, 143, 134, 0.04) 0%,
            transparent 50%
          );
        pointer-events: none;
        z-index: 0;
      }

      /* Nav */
      .site-nav {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: 64px;
        background: var(--bone);
        border-bottom: 1px solid var(--slate-200);
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 40px;
        z-index: 200;
      }
      .nav-logo {
        display: flex;
        align-items: center;
        gap: 14px;
        text-decoration: none;
      }
      .nav-logo img {
        height: 36px;
        width: auto;
      }
      .nav-links {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .nav-link {
        font-family: "IBM Plex Mono", monospace;
        font-size: 13px;
        font-weight: 500;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        text-decoration: none;
        color: var(--slate-500);
        padding: 8px 16px;
        border-radius: 6px;
        transition: all 0.2s ease;
      }
      .nav-link:hover {
        color: var(--teal-700);
        background: var(--teal-100);
      }
      .nav-link.active {
        color: var(--teal-700);
        background: var(--teal-100);
      }

      /* Header */
      .page-header {
        padding: 100px 40px 40px;
        text-align: center;
        position: relative;
        z-index: 1;
      }
      .header-eyebrow {
        font-family: "IBM Plex Mono", monospace;
        font-size: 14px;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--teal-700);
        font-weight: 500;
        margin-bottom: 16px;
      }
      .header-title {
        font-family: "Outfit", sans-serif;
        font-size: 48px;
        font-weight: 500;
        letter-spacing: -0.025em;
        line-height: 1.1;
        color: var(--slate-800);
        margin-bottom: 12px;
      }

      /* Mode Toggle */
      .mode-toggle {
        display: flex;
        justify-content: center;
        margin: 24px auto 32px;
        position: relative;
        z-index: 1;
      }
      .mode-toggle-inner {
        display: flex;
        background: var(--bone);
        border: 1px solid var(--slate-200);
        border-radius: 40px;
        padding: 4px;
        gap: 4px;
      }
      .mode-btn {
        font-family: "IBM Plex Sans", sans-serif;
        font-size: 15px;
        font-weight: 500;
        padding: 10px 28px;
        border-radius: 36px;
        border: none;
        cursor: pointer;
        transition: all 0.25s ease;
        background: transparent;
        color: var(--slate-600);
      }
      .mode-btn.active {
        background: var(--teal-700);
        color: #fff;
      }
      .mode-btn:hover:not(.active) {
        background: var(--teal-100);
        color: var(--teal-700);
      }

      /* Version Toggle */
      .version-toggle {
        display: flex;
        flex-direction: column;
        align-items: center;
        margin: 0 auto 28px;
        position: relative;
        z-index: 1;
      }
      .version-toggle-inner {
        display: flex;
        background: var(--bone);
        border: 1px solid var(--slate-200);
        border-radius: 24px;
        padding: 3px;
        gap: 3px;
      }
      .version-btn {
        font-family: "IBM Plex Mono", monospace;
        font-size: 12px;
        font-weight: 500;
        padding: 6px 18px;
        border-radius: 20px;
        border: none;
        cursor: pointer;
        transition: all 0.25s ease;
        background: transparent;
        color: var(--slate-500);
        letter-spacing: 0.04em;
      }
      .version-btn.active {
        background: var(--teal-700);
        color: #fff;
      }
      .version-btn:hover:not(.active) {
        background: var(--teal-100);
        color: var(--teal-700);
      }
      .version-desc {
        font-family: "IBM Plex Sans", sans-serif;
        font-size: 12px;
        color: var(--slate-400);
        margin-top: 8px;
        text-align: center;
        line-height: 1.4;
      }
      .version-badge {
        font-family: "IBM Plex Mono", monospace;
        font-size: 10px;
        font-weight: 500;
        padding: 2px 7px;
        border-radius: 4px;
        margin-left: 8px;
        letter-spacing: 0.04em;
        vertical-align: middle;
      }
      .version-badge.v1 {
        background: #ede9fe;
        color: #6d28d9;
      }
      .version-badge.v2 {
        background: var(--teal-100);
        color: var(--teal-700);
      }

      /* Content */
      .content-area {
        max-width: 960px;
        margin: 0 auto;
        padding: 0 40px 60px;
        position: relative;
        z-index: 1;
      }

      /* Category Filters */
      .category-filters {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-bottom: 20px;
      }
      .cat-btn {
        font-family: "IBM Plex Sans", sans-serif;
        font-size: 14px;
        font-weight: 500;
        padding: 8px 18px;
        border-radius: 20px;
        border: 1px solid var(--slate-200);
        background: var(--bone);
        color: var(--slate-600);
        cursor: pointer;
        transition: all 0.2s ease;
        white-space: nowrap;
      }
      .cat-btn:hover {
        border-color: var(--teal-400);
        color: var(--teal-700);
      }
      .cat-btn.active {
        background: var(--teal-100);
        color: var(--teal-700);
        border-color: var(--teal-400);
      }

      /* Search */
      .search-wrap {
        margin-bottom: 28px;
      }
      .search-input {
        width: 100%;
        padding: 14px 20px;
        border: 1px solid var(--slate-200);
        border-radius: 12px;
        font-family: "IBM Plex Sans", sans-serif;
        font-size: 15px;
        color: var(--ink);
        background: var(--bone);
        outline: none;
        transition: border-color 0.2s;
      }
      .search-input::placeholder {
        color: var(--slate-400);
      }
      .search-input:focus {
        border-color: var(--teal-400);
      }

      /* Script Cards */
      .script-cards {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .script-card {
        background: var(--bone);
        border: 1px solid var(--slate-200);
        border-radius: 12px;
        padding: 20px 24px;
        cursor: pointer;
        transition: all 0.2s ease;
      }
      .script-card:hover {
        border-color: var(--teal-400);
      }
      .script-card-header {
        display: flex;
        align-items: flex-start;
        gap: 12px;
      }
      .script-id {
        font-family: "IBM Plex Mono", monospace;
        font-size: 12px;
        font-weight: 500;
        background: var(--teal-100);
        color: var(--teal-700);
        padding: 4px 10px;
        border-radius: 6px;
        white-space: nowrap;
        flex-shrink: 0;
        margin-top: 2px;
      }
      .script-title {
        font-family: "Outfit", sans-serif;
        font-size: 18px;
        font-weight: 500;
        color: var(--slate-800);
        line-height: 1.3;
      }
      .script-when {
        font-style: italic;
        color: var(--ink-soft);
        font-size: 14px;
        margin-top: 6px;
        margin-left: 0;
      }
      .script-body {
        max-height: 0;
        overflow: hidden;
        transition:
          max-height 0.4s ease,
          opacity 0.3s ease;
        opacity: 0;
        margin-top: 0;
      }
      .script-card.expanded .script-body {
        max-height: 4000px;
        opacity: 1;
        margin-top: 16px;
      }
      .script-line {
        border-left: 3px solid var(--teal-400);
        padding: 12px 16px;
        background: var(--teal-100);
        border-radius: 0 8px 8px 0;
        margin-bottom: 8px;
        font-style: italic;
        font-size: 15px;
        line-height: 1.6;
        color: var(--ink);
      }
      .script-line .var {
        font-family: "IBM Plex Mono", monospace;
        background: var(--teal-100);
        color: var(--teal-700);
        padding: 2px 6px;
        border-radius: 4px;
        font-style: normal;
        font-size: 13px;
      }
      .branch-label {
        font-weight: 700;
        font-size: 13px;
        margin-top: 12px;
        margin-bottom: 6px;
        color: var(--ink);
      }
      .script-tip {
        background: var(--paper-deep);
        padding: 12px 16px;
        border-radius: 8px;
        font-style: italic;
        font-size: 14px;
        color: var(--ink-soft);
        margin-top: 8px;
      }
      .script-note {
        background: var(--paper-deep);
        padding: 12px 16px;
        border-radius: 8px;
        font-style: italic;
        font-size: 14px;
        color: var(--ink-soft);
        margin-top: 8px;
      }
      .no-results {
        text-align: center;
        padding: 40px 20px;
        color: var(--slate-400);
        font-size: 16px;
      }
      .expand-icon {
        margin-left: auto;
        color: var(--slate-400);
        transition: transform 0.3s ease;
        flex-shrink: 0;
        font-size: 20px;
        line-height: 1;
      }
      .script-card.expanded .expand-icon {
        transform: rotate(180deg);
      }

      /* Practice Mode */
      .scenario-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
        margin-top: 8px;
      }
      .scenario-card {
        background: var(--bone);
        border: 1px solid var(--slate-200);
        border-radius: 12px;
        padding: 28px 24px;
        cursor: pointer;
        transition: all 0.3s ease;
        position: relative;
        overflow: hidden;
      }
      .scenario-card::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 3px;
        background: linear-gradient(90deg, var(--teal-700), var(--teal-500));
        opacity: 0;
        transition: opacity 0.3s;
      }
      .scenario-card:hover {
        border-color: var(--teal-400);
        transform: translateY(-2px);
        box-shadow: 0 8px 24px rgba(30, 143, 134, 0.08);
      }
      .scenario-card:hover::before {
        opacity: 1;
      }
      .scenario-card-title {
        font-family: "Outfit", sans-serif;
        font-size: 20px;
        font-weight: 500;
        color: var(--slate-800);
        margin-bottom: 6px;
      }
      .scenario-card-sub {
        font-size: 14px;
        color: var(--ink-soft);
        margin-bottom: 16px;
        line-height: 1.5;
      }
      .scenario-card-meta {
        display: flex;
        gap: 16px;
        align-items: center;
      }
      .scenario-diff {
        font-family: "IBM Plex Mono", monospace;
        font-size: 11px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        padding: 4px 10px;
        border-radius: 12px;
        font-weight: 500;
      }
      .diff-easy {
        background: var(--teal-100);
        color: var(--teal-700);
      }
      .diff-medium {
        background: #fef3c7;
        color: #92400e;
      }
      .diff-hard {
        background: #fde2e2;
        color: #b8472e;
      }
      .scenario-steps-badge {
        font-family: "IBM Plex Mono", monospace;
        font-size: 12px;
        color: var(--slate-500);
      }
      .best-score {
        font-family: "IBM Plex Mono", monospace;
        font-size: 12px;
        color: var(--teal-700);
        margin-left: auto;
      }

      /* Active Scenario */
      .scenario-active {
        display: none;
      }
      .scenario-active.visible {
        display: block;
      }
      .scenario-back-btn {
        font-family: "IBM Plex Sans", sans-serif;
        font-size: 14px;
        color: var(--slate-500);
        background: none;
        border: none;
        cursor: pointer;
        padding: 8px 0;
        margin-bottom: 16px;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .scenario-back-btn:hover {
        color: var(--teal-700);
      }
      .context-card {
        background: var(--bone);
        border: 1px solid var(--slate-200);
        border-radius: 12px;
        padding: 20px 24px;
        margin-bottom: 20px;
      }
      .context-card-title {
        font-family: "Outfit", sans-serif;
        font-size: 18px;
        font-weight: 500;
        color: var(--slate-800);
        margin-bottom: 8px;
      }
      .context-card-details {
        display: flex;
        flex-wrap: wrap;
        gap: 16px;
        font-size: 14px;
        color: var(--ink-soft);
      }
      .context-detail {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .context-label {
        font-weight: 600;
        color: var(--slate-600);
      }
      .progress-bar-wrap {
        margin-bottom: 20px;
      }
      .progress-label {
        font-family: "IBM Plex Mono", monospace;
        font-size: 13px;
        color: var(--slate-500);
        margin-bottom: 6px;
      }
      .progress-track {
        height: 4px;
        background: var(--slate-200);
        border-radius: 4px;
        overflow: hidden;
      }
      .progress-fill {
        height: 100%;
        background: linear-gradient(90deg, var(--teal-700), var(--teal-500));
        border-radius: 4px;
        transition: width 0.4s ease;
      }
      .transcript {
        max-height: 400px;
        overflow-y: auto;
        margin-bottom: 20px;
        padding: 16px;
        background: var(--bone);
        border: 1px solid var(--slate-200);
        border-radius: 12px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .msg {
        max-width: 80%;
        padding: 12px 16px;
        border-radius: 12px;
        font-size: 14px;
        line-height: 1.5;
      }
      .msg-client {
        align-self: flex-start;
        background: var(--slate-100);
        color: var(--ink);
        border-bottom-left-radius: 4px;
      }
      .msg-ac {
        align-self: flex-end;
        background: var(--teal-600);
        color: #fff;
        border-bottom-right-radius: 4px;
      }
      .msg-label {
        font-family: "IBM Plex Mono", monospace;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        margin-bottom: 4px;
        opacity: 0.7;
      }
      .client-prompt {
        background: var(--slate-100);
        border: 1px solid var(--slate-200);
        border-radius: 12px;
        padding: 16px 20px;
        margin-bottom: 16px;
      }
      .client-prompt-label {
        font-family: "IBM Plex Mono", monospace;
        font-size: 11px;
        color: var(--teal-700);
        text-transform: uppercase;
        letter-spacing: 0.08em;
        margin-bottom: 6px;
      }
      .client-prompt-text {
        font-size: 15px;
        color: var(--ink);
        font-style: italic;
      }
      .client-prompt-context {
        font-size: 13px;
        color: var(--ink-soft);
        margin-top: 8px;
      }
      .response-options {
        display: flex;
        flex-direction: column;
        gap: 10px;
        margin-bottom: 16px;
      }
      .response-btn {
        width: 100%;
        text-align: left;
        padding: 16px 20px;
        border: 1px solid var(--slate-200);
        border-radius: 10px;
        background: var(--bone);
        font-family: "IBM Plex Sans", sans-serif;
        font-size: 14px;
        color: var(--ink);
        cursor: pointer;
        transition: all 0.2s ease;
        line-height: 1.5;
      }
      .response-btn:hover:not(.chosen) {
        border-color: var(--teal-400);
        background: var(--teal-100);
      }
      .response-btn.chosen.correct {
        border-color: var(--teal-400);
        background: var(--teal-100);
      }
      .response-btn.chosen.wrong {
        border-color: #e6a898;
        background: #fdf0ec;
      }
      .response-btn.disabled {
        pointer-events: none;
        opacity: 0.5;
      }
      .response-btn.highlight-correct {
        border-color: var(--teal-400);
        background: var(--teal-100);
      }
      .feedback-panel {
        padding: 16px 20px;
        border-radius: 10px;
        margin-bottom: 16px;
        display: none;
      }
      .feedback-panel.visible {
        display: block;
      }
      .feedback-panel.correct {
        background: var(--teal-100);
        border: 1px solid var(--teal-400);
      }
      .feedback-panel.wrong {
        background: #fdf0ec;
        border: 1px solid #e6a898;
      }
      .feedback-label {
        font-weight: 700;
        font-size: 14px;
        margin-bottom: 4px;
      }
      .feedback-label.correct {
        color: var(--teal-700);
      }
      .feedback-label.wrong {
        color: #b8472e;
      }
      .feedback-text {
        font-size: 14px;
        color: var(--ink-soft);
        line-height: 1.5;
      }
      .continue-btn {
        display: inline-block;
        margin-top: 12px;
        padding: 10px 24px;
        background: var(--teal-700);
        color: #fff;
        border: none;
        border-radius: 8px;
        font-family: "IBM Plex Sans", sans-serif;
        font-size: 14px;
        font-weight: 500;
        cursor: pointer;
        transition: background 0.2s;
      }
      .continue-btn:hover {
        background: var(--teal-600);
      }

      /* Scorecard */
      .scorecard {
        display: none;
        text-align: center;
        background: var(--bone);
        border: 1px solid var(--slate-200);
        border-radius: 16px;
        padding: 48px 40px;
      }
      .scorecard.visible {
        display: block;
      }
      .scorecard-title {
        font-family: "Outfit", sans-serif;
        font-size: 32px;
        font-weight: 500;
        color: var(--slate-800);
        margin-bottom: 8px;
      }
      .scorecard-fraction {
        font-family: "IBM Plex Mono", monospace;
        font-size: 56px;
        font-weight: 500;
        color: var(--teal-700);
        margin: 16px 0 8px;
      }
      .scorecard-pct {
        font-size: 18px;
        color: var(--ink-soft);
        margin-bottom: 24px;
      }
      .scorecard-breakdown {
        text-align: left;
        max-width: 500px;
        margin: 0 auto 32px;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .scorecard-step {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 14px;
        padding: 8px 12px;
        border-radius: 8px;
      }
      .scorecard-step.step-correct {
        background: var(--teal-100);
        color: var(--teal-700);
      }
      .scorecard-step.step-wrong {
        background: #fdf0ec;
        color: #b8472e;
      }
      .scorecard-step-num {
        font-family: "IBM Plex Mono", monospace;
        font-weight: 500;
        width: 28px;
      }
      .scorecard-step-icon {
        width: 20px;
        text-align: center;
      }
      .scorecard-btns {
        display: flex;
        gap: 12px;
        justify-content: center;
      }
      .scorecard-btn {
        padding: 12px 28px;
        border-radius: 10px;
        font-family: "IBM Plex Sans", sans-serif;
        font-size: 15px;
        font-weight: 500;
        cursor: pointer;
        transition: all 0.2s;
        border: none;
      }
      .scorecard-btn.primary {
        background: var(--teal-700);
        color: #fff;
      }
      .scorecard-btn.primary:hover {
        background: var(--teal-600);
      }
      .scorecard-btn.secondary {
        background: var(--bone);
        color: var(--slate-600);
        border: 1px solid var(--slate-200);
      }
      .scorecard-btn.secondary:hover {
        border-color: var(--teal-400);
        color: var(--teal-700);
      }

      /* Practice Intro */
      .practice-intro {
        text-align: center;
        margin-bottom: 28px;
      }
      .practice-intro-title {
        font-family: "Outfit", sans-serif;
        font-size: 24px;
        font-weight: 500;
        color: var(--slate-800);
        margin-bottom: 8px;
      }
      .practice-intro-desc {
        font-size: 15px;
        color: var(--ink-soft);
        line-height: 1.6;
        max-width: 580px;
        margin: 0 auto;
      }

      /* Scenario Intro */
      .scenario-intro {
        background: var(--bone);
        border: 1px solid var(--slate-200);
        border-radius: 16px;
        padding: 48px 40px;

        /* ── State ── */
        var currentMode = "reference";
        var currentVersion = "v1";
        var currentCategory = "objections";
        var searchTerm = "";
        var expandedCards = {};
        var currentScenario = null;
        var currentStep = 0;
        var score = 0;
        var stepResults = [];
        var savedScores = JSON.parse(
          localStorage.getItem("ac-call-scripts-scores") || "{}",
        );

        var VERSION_DESCS = {
          v1: "Direct, chest-voice approach \u2014 pain first, statements not questions",
          v2: "Standard collaborative approach",
        };

        /* ── Mode Toggle ── */
        document.querySelectorAll(".mode-btn").forEach(function (btn) {
          btn.addEventListener("click", function () {
            document.querySelectorAll(".mode-btn").forEach(function (b) {
              b.classList.remove("active");
            });
            btn.classList.add("active");
            currentMode = btn.getAttribute("data-mode");
            if (currentMode === "reference") {
              el("referenceMode").style.display = "";
              el("practiceMode").style.display = "none";
              el("versionToggle").style.display = "";
            } else {
              el("referenceMode").style.display = "none";
              el("practiceMode").style.display = "";
              el("versionToggle").style.display = "none";
              currentScenario = null;
              renderPracticeMode();
            }
          });
        });

        /* ── Version Toggle ── */
        document.querySelectorAll(".version-btn").forEach(function (btn) {
          btn.addEventListener("click", function () {
            document.querySelectorAll(".version-btn").forEach(function (b) {
              b.classList.remove("active");
            });
            btn.classList.add("active");
            currentVersion = btn.getAttribute("data-version");
            el("versionDesc").textContent = VERSION_DESCS[currentVersion];
            renderReferenceMode();
          });
        });

        /* ── Highlight Variables ── */
        function highlightVars(text) {
          return text.replace(/\{(\w+)\}/g, '<span class="var">{$1}</span>');
        }

        /* ── REFERENCE MODE ── */
        function renderReferenceMode() {
          var container = el("referenceMode");
          container.innerHTML = "";

          /* Category filters */
          var filterRow = createEl("div", "category-filters");
          CATEGORIES.forEach(function (cat) {
            var btn = createEl(
              "button",
              "cat-btn" + (cat.key === currentCategory ? " active" : ""),
              cat.label,
            );
            btn.addEventListener("click", function () {
              currentCategory = cat.key;
              renderReferenceMode();
            });
            filterRow.appendChild(btn);
          });
          container.appendChild(filterRow);

          /* Search */
          var searchWrap = createEl("div", "search-wrap");
          var searchInput = document.createElement("input");
          searchInput.type = "text";
          searchInput.className = "search-input";
          searchInput.placeholder = "Search scripts by keyword...";
          searchInput.value = searchTerm;
          searchInput.addEventListener("input", function () {
            searchTerm = this.value;
            renderScriptCards();
          });
          searchWrap.appendChild(searchInput);
          container.appendChild(searchWrap);

          /* Cards container */
          var cardsDiv = createEl("div", "script-cards");
          cardsDiv.id = "scriptCards";
          container.appendChild(cardsDiv);

          renderScriptCards();
        }

        function renderScriptCards() {
          var cardsDiv = el("scriptCards");
          cardsDiv.innerHTML = "";

          var filtered = SCRIPTS.filter(function (s) {
            return s.cat === currentCategory;
          });

          if (searchTerm.trim()) {
            var term = searchTerm.toLowerCase();
            filtered = filtered.filter(function (s) {
              var haystack = (
                s.id +
                " " +
                s.title +
                " " +
                s.when +
                " " +
                (s.lines || [])
                  .map(function (l) {
                    return l.text;
                  })
                  .join(" ")
              ).toLowerCase();
              if (s.branches) {
                s.branches.forEach(function (b) {
                  haystack +=
                    " " +
                    b.label +
                    " " +
                    b.lines
                      .map(function (l) {
                        return l.text;
                      })
                      .join(" ");
                });
              }
              if (s.tip) haystack += " " + s.tip;
              if (s.note) haystack += " " + s.note;
              return haystack.indexOf(term) !== -1;
            });
          }

          if (filtered.length === 0) {
            cardsDiv.appendChild(
              createEl("div", "no-results", "No scripts match your search."),
            );
            return;
          }

          filtered.forEach(function (script) {
            /* Resolve versioned content: v1 overrides fall back to base */
            var hasV1 = !!script.v1;
            var useV1 = hasV1 && currentVersion === "v1";
            var displayLines =
              useV1 && script.v1.lines ? script.v1.lines : script.lines;
            var displayBranches =
              useV1 && script.v1.branches !== undefined
                ? script.v1.branches
                : script.branches;
            var displayTip =
              useV1 && script.v1.tip !== undefined ? script.v1.tip : script.tip;
            var displayNote =
              useV1 && script.v1.note !== undefined
                ? script.v1.note
                : script.note;

            var card = createEl(
              "div",
              "script-card" + (expandedCards[script.id] ? " expanded" : ""),
            );

            /* Header */
            var header = createEl("div", "script-card-header");
            var idSpan = createEl("span", "script-id", script.id);
            header.appendChild(idSpan);
            var titleCol = createEl("div", "");
            var titleRow = createEl("div", "script-title");
            titleRow.textContent = script.title;
            if (hasV1) {
              var badge = createEl(
                "span",
                "version-badge " + currentVersion,
                currentVersion === "v1" ? "V1" : "V2",
              );
              titleRow.appendChild(badge);
            }
            titleCol.appendChild(titleRow);
            if (script.when) {
              titleCol.appendChild(createEl("div", "script-when", script.when));
            }
            header.appendChild(titleCol);
            header.appendChild(createEl("span", "expand-icon", "\u25BC"));
            card.appendChild(header);

            /* Body */
            var body = createEl("div", "script-body");

            if (displayLines && displayLines.length > 0) {
              displayLines.forEach(function (line) {
                var lineEl = createEl("div", "script-line");
                lineEl.innerHTML = highlightVars(
                  line.text,
                ); /* static script data only */
                body.appendChild(lineEl);
              });
            }

            if (displayBranches) {
              displayBranches.forEach(function (branch) {
                body.appendChild(createEl("div", "branch-label", branch.label));
                branch.lines.forEach(function (line) {
                  var lineEl = createEl("div", "script-line");
                  lineEl.innerHTML = highlightVars(
                    line.text,
                  ); /* static script data only */
                  body.appendChild(lineEl);
                });
              });
            }

            if (displayTip) {
              body.appendChild(
                createEl("div", "script-tip", "Tip: " + displayTip),
              );
            }
            if (displayNote) {
              body.appendChild(
                createEl("div", "script-note", "Note: " + displayNote),
              );
            }

            card.appendChild(body);

            card.addEventListener("click", function () {
              if (expandedCards[script.id]) {
                delete expandedCards[script.id];
                card.classList.remove("expanded");
              } else {
                expandedCards[script.id] = true;
                card.classList.add("expanded");
              }
            });

            cardsDiv.appendChild(card);
          });
        }

        /* ── PRACTICE MODE ── */
        function renderPracticeMode() {
          var container = el("practiceMode");
          container.innerHTML = "";

          if (currentScenario === null) {
            renderScenarioSelection(container);
          } else {
            renderActiveScenario(container);
          }
        }

        function renderScenarioSelection(container) {
          var intro = createEl("div", "practice-intro");
          intro.appendChild(
            createEl("div", "practice-intro-title", "Practice Call Scenarios"),
          );
          intro.appendChild(
            createEl(
              "p",
              "practice-intro-desc",
              "Role-play as the AC on simulated phone calls. Each scenario presents a different type of caller \u2014 read what the client says, pick the best response from your call scripts, and get instant feedback. Pick a scenario to start.",
            ),
          );
          container.appendChild(intro);

          var grid = createEl("div", "scenario-grid");

          SCENARIOS.forEach(function (sc, idx) {
            var card = createEl("div", "scenario-card");
            card.appendChild(createEl("div", "scenario-card-title", sc.title));
            card.appendChild(createEl("div", "scenario-card-sub", sc.sub));

            var meta = createEl("div", "scenario-card-meta");
            var diffCls =
              sc.diff === "easy"
                ? "diff-easy"
                : sc.diff === "medium"
                  ? "diff-medium"
                  : "diff-hard";
            meta.appendChild(
              createEl(
                "span",
                "scenario-diff " + diffCls,
                sc.diff.charAt(0).toUpperCase() + sc.diff.slice(1),
              ),
            );
            meta.appendChild(
              createEl("span", "scenario-steps-badge", sc.stepCount + " steps"),
            );

            if (savedScores[sc.key] !== undefined) {
              meta.appendChild(
                createEl(
                  "span",
                  "best-score",
                  "Best: " + savedScores[sc.key] + "/" + sc.stepCount,
                ),
              );
            }

            card.appendChild(meta);

            card.addEventListener("click", function () {
              currentScenario = idx;
              currentStep = -1;
              score = 0;
              stepResults = [];
              renderPracticeMode();
            });

            grid.appendChild(card);
          });

          container.appendChild(grid);
        }

        function renderActiveScenario(container) {
          var sc = SCENARIOS[currentScenario];
          var isComplete = currentStep >= sc.steps.length;

          /* Back button */
          var backBtn = createEl(
            "button",
            "scenario-back-btn",
            "\u2190 Back to Scenarios",
          );
          backBtn.addEventListener("click", function () {
            currentScenario = null;
            renderPracticeMode();
          });
          container.appendChild(backBtn);

          /* Intro screen */
          if (currentStep === -1) {
            var intro = createEl("div", "scenario-intro");
            intro.appendChild(
              createEl("div", "scenario-intro-title", sc.title),
            );
            intro.appendChild(createEl("div", "scenario-intro-sub", sc.sub));

            var how = createEl("div", "scenario-intro-how");
            how.appendChild(
              createEl("div", "scenario-intro-how-title", "How it works"),
            );
            var ol = document.createElement("ol");
            var howSteps = [
              "You are the AC (Admissions Coordinator) on a live call",
              "Read what the client says, then pick the best response",
              "Get instant feedback on each choice \u2014 correct or not ideal",
              "The call continues regardless, so you see the full flow",
              "At the end you get a scorecard with your results",
            ];
            howSteps.forEach(function (s) {
              var li = document.createElement("li");
              li.textContent = s;
              ol.appendChild(li);
            });
            how.appendChild(ol);
            intro.appendChild(how);

            var detailsRow = createEl("div", "scenario-intro-details");
            var d1 = createEl("span", "scenario-intro-detail");
            var d1b = document.createElement("strong");
            d1b.textContent = sc.stepCount;
            d1.appendChild(d1b);
            d1.appendChild(document.createTextNode(" steps"));
            var d2 = createEl("span", "scenario-intro-detail");
            d2.appendChild(document.createTextNode("Client: "));
            var d2b = document.createElement("strong");
            d2b.textContent = "Sarah Mitchell";
            d2.appendChild(d2b);
            var d3 = createEl("span", "scenario-intro-detail");
            d3.appendChild(document.createTextNode("HA: "));
            var d3b = document.createElement("strong");
            d3b.textContent = "Dr. Anderson";
            d3.appendChild(d3b);
            detailsRow.appendChild(d1);
            detailsRow.appendChild(d2);
            detailsRow.appendChild(d3);
            intro.appendChild(detailsRow);

            var startBtn = createEl(
              "button",
              "start-scenario-btn",
              "Start Scenario",
            );
            startBtn.addEventListener("click", function () {
              currentStep = 0;
              renderPracticeMode();
            });
            intro.appendChild(startBtn);

            container.appendChild(intro);
            return;
          }

          var step = sc.steps[currentStep];

          if (isComplete) {
            renderScorecard(container, sc);
            return;
          }

          /* Context card */
          var ctx = createEl("div", "context-card");
          ctx.appendChild(createEl("div", "context-card-title", sc.title));
          var details = createEl("div", "context-card-details");
          details.innerHTML =
            '<span class="context-detail"><span class="context-label">Client:</span> Sarah Mitchell</span>' +
            '<span class="context-detail"><span class="context-label">HA:</span> Dr. Anderson</span>' +
            '<span class="context-detail"><span class="context-label">Appt:</span> May 5 at 2:00 PM EST</span>';
          ctx.appendChild(details);
          container.appendChild(ctx);

          /* Progress */
          var progWrap = createEl("div", "progress-bar-wrap");
          progWrap.appendChild(
            createEl(
              "div",
              "progress-label",
              "Step " + (currentStep + 1) + " of " + sc.steps.length,
            ),
          );
          var track = createEl("div", "progress-track");
          var fill = createEl("div", "progress-fill");
          fill.style.width = (currentStep / sc.steps.length) * 100 + "%";
          track.appendChild(fill);
          progWrap.appendChild(track);
          container.appendChild(progWrap);

          /* Transcript (only show if there are past messages) */
          if (currentStep > 0) {
            var transcript = createEl("div", "transcript");
            transcript.id = "transcript";
            for (var i = 0; i < currentStep; i++) {
              var pastStep = sc.steps[i];
              var clientMsg = createEl("div", "msg msg-client");
              var clientLabel = createEl("div", "msg-label", "Client");
              clientMsg.appendChild(clientLabel);
              clientMsg.appendChild(document.createTextNode(pastStep.client));
              transcript.appendChild(clientMsg);

              if (stepResults[i] !== undefined) {
                var chosenOpt = pastStep.options[stepResults[i]];
                var acMsg = createEl("div", "msg msg-ac");
                var acLabel = createEl("div", "msg-label", "You");
                acMsg.appendChild(acLabel);
                acMsg.appendChild(document.createTextNode(chosenOpt.text));
                transcript.appendChild(acMsg);
              }
            }
            container.appendChild(transcript);
            setTimeout(function () {
              transcript.scrollTop = transcript.scrollHeight;
            }, 50);
          }

          /* Client prompt */
          var prompt = createEl("div", "client-prompt");
          prompt.appendChild(
            createEl("div", "client-prompt-label", "Client says:"),
          );
          prompt.appendChild(
            createEl("div", "client-prompt-text", step.client),
          );
          prompt.appendChild(
            createEl("div", "client-prompt-context", step.context),
          );
          container.appendChild(prompt);

          /* Response options */
          var optionsDiv = createEl("div", "response-options");
          optionsDiv.id = "responseOptions";
          step.options.forEach(function (opt, oi) {
            var btn = createEl("button", "response-btn", opt.text);
            btn.setAttribute("data-idx", oi);
            btn.addEventListener("click", function () {
              handleResponse(oi, opt, step);
            });
            optionsDiv.appendChild(btn);
          });
          container.appendChild(optionsDiv);

          /* Feedback panel placeholder */
          var feedback = createEl("div", "feedback-panel");
          feedback.id = "feedbackPanel";
          container.appendChild(feedback);
        }

        function handleResponse(idx, opt, step) {
          var buttons = document.querySelectorAll(
            "#responseOptions .response-btn",
          );
          var wasCorrect = opt.correct;

          buttons.forEach(function (btn) {
            btn.classList.add("disabled");
            var bi = parseInt(btn.getAttribute("data-idx"));
            if (bi === idx) {
              btn.classList.add("chosen");
              btn.classList.add(wasCorrect ? "correct" : "wrong");
            }
            if (step.options[bi].correct && bi !== idx) {
              btn.classList.add("highlight-correct");
            }
          });

          if (wasCorrect) score++;
          stepResults.push(idx);

          /* Show feedback */
          var panel = el("feedbackPanel");
          panel.className =
            "feedback-panel visible " + (wasCorrect ? "correct" : "wrong");
          panel.innerHTML = "";
          panel.appendChild(
            createEl(
              "div",
              "feedback-label " + (wasCorrect ? "correct" : "wrong"),
              wasCorrect ? "Correct!" : "Not Ideal",
            ),
          );
          panel.appendChild(createEl("div", "feedback-text", opt.why));

          var contBtn = createEl("button", "continue-btn", "Continue");
          contBtn.addEventListener("click", function () {
            currentStep++;
            renderPracticeMode();
          });
          panel.appendChild(contBtn);
        }

        function renderScorecard(container, sc) {
          var pct = Math.round((score / sc.steps.length) * 100);

          /* Save best score */
          if (
            savedScores[sc.key] === undefined ||
            score > savedScores[sc.key]
          ) {
            savedScores[sc.key] = score;
            localStorage.setItem(
              "ac-call-scripts-scores",
              JSON.stringify(savedScores),
            );
          }

          var card = createEl("div", "scorecard visible");
          card.appendChild(
            createEl("div", "scorecard-title", "Scenario Complete"),
          );
          card.appendChild(
            createEl(
              "div",
              "scorecard-fraction",
              score + "/" + sc.steps.length,
            ),
          );
          card.appendChild(createEl("div", "scorecard-pct", pct + "% correct"));

          /* Breakdown */
          var breakdown = createEl("div", "scorecard-breakdown");
          sc.steps.forEach(function (step, i) {
            var chosen = stepResults[i];
            var wasCorrect =
              step.options[chosen] && step.options[chosen].correct;
            var row = createEl(
              "div",
              "scorecard-step " + (wasCorrect ? "step-correct" : "step-wrong"),
            );
            row.appendChild(
              createEl("span", "scorecard-step-num", "#" + (i + 1)),
            );
            row.appendChild(
              createEl(
                "span",
                "scorecard-step-icon",
                wasCorrect ? "\u2713" : "\u2717",
              ),
            );
            var label =
              step.client.length > 60
                ? step.client.substring(0, 57) + "..."
                : step.client;
            row.appendChild(createEl("span", "", label));
            breakdown.appendChild(row);
          });
          card.appendChild(breakdown);

          /* Buttons */
          var btns = createEl("div", "scorecard-btns");

          var tryAgain = createEl(
            "button",
            "scorecard-btn secondary",
            "Try Again",
          );
          tryAgain.addEventListener("click", function () {
            currentStep = 0;
            score = 0;
            stepResults = [];
            renderPracticeMode();
          });
          btns.appendChild(tryAgain);

          var nextIdx = (currentScenario + 1) % SCENARIOS.length;
          var nextBtn = createEl(
            "button",
            "scorecard-btn primary",
            "Next Scenario",
          );
          nextBtn.addEventListener("click", function () {
            currentScenario = nextIdx;
            currentStep = 0;
            score = 0;
            stepResults = [];
            renderPracticeMode();
          });
          btns.appendChild(nextBtn);

          card.appendChild(btns);
          container.appendChild(card);
        }

        /* ── Init ── */
        renderReferenceMode();
      })();
    </script>
  </body>
</html>
