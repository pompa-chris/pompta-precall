      :root {
        --s9: #1b2a31;
        --s8: #243841;
        --s7: #2f4a56;
        --s6: #3f5b68;
        --s5: #5a7682;
        --s4: #89a0ab;
        --s3: #b5c6cd;
        --s2: #dce5e9;
        --s1: #edf1f3;
        --t7: #1e8f86;
        --t6: #2db3a6;
        --t5: #4ec5b9;
        --t4: #87d8d0;
        --t2: #c9eae6;
        --t1: #e6f5f2;
        --paper: #f7f3ed;
        --bone: #fbf9f4;
        --ink: #1a262c;
        --ink2: #3d5059;
        --hs-blue: #0091ae;
        --hs-blue-light: #e5f5f8;
        --hs-dark: #33475b;
        --hs-gray: #516f90;
        --hs-border: #cbd6e2;
        --hs-bg: #f5f8fa;
        --hs-white: #ffffff;

        /* Message type colors */
        --purple: #7b1fa2;
        --purple-bg: rgba(123, 31, 162, 0.06);
        --purple-bd: rgba(123, 31, 162, 0.15);
        --blue: #1565c0;
        --blue-bg: rgba(21, 101, 192, 0.06);
        --blue-bd: rgba(21, 101, 192, 0.15);
        --green: #2e7d32;
        --green-bg: #ffffff;
        --green-bd: #dce5e9;
        --orange: #e65100;
        --orange-bg: rgba(230, 81, 0, 0.06);
        --orange-bd: rgba(230, 81, 0, 0.15);
        --teal: #1e8f86;
        --teal-bg: rgba(30, 143, 134, 0.08);
        --teal-bd: rgba(30, 143, 134, 0.2);
      }

      /* ── Reset ── */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        background: var(--hs-bg);
        color: var(--hs-dark);
        font-family: "IBM Plex Sans", system-ui, sans-serif;
        line-height: 1.6;
        overflow: hidden;
        height: 100vh;
      }

      /* ── Site Nav (64px fixed) ── */
      .site-nav {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: 64px;
        background: var(--bone);
        border-bottom: 1px solid var(--s2);
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 40px;
        z-index: 100;
      }

      .nav-logo {
        display: flex;
        align-items: center;
        gap: 14px;
        text-decoration: none;
      }

      .nav-logo img {
        height: 36px;
      }

      .nav-links {
        display: flex;
        gap: 8px;
      }

      .nav-link {
        font-family: "IBM Plex Mono", monospace;
        font-size: 13px;
        font-weight: 500;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        text-decoration: none;
        color: var(--s5);
        padding: 8px 16px;
        border-radius: 6px;
        transition: all 0.2s ease;
      }

      .nav-link:hover {
        color: var(--t7);
        background: var(--t1);
      }

      .nav-link.active {
        color: var(--t7);
        background: var(--t1);
      }

      /* ── App layout ── */
      .app {
        display: flex;
        height: calc(100vh - 64px);
        margin-top: 64px;
      }

      /* ── Chat panel (left) ── */
      .chat-panel {
        flex: 1;
        display: flex;
        flex-direction: column;
        min-width: 0;
      }

      .chat-header {
        padding: 14px 24px;
        border-bottom: 1px solid var(--hs-border);
        background: var(--hs-white);
        display: flex;
        flex-direction: row;
        align-items: center;
        gap: 16px;
      }

      .chat-back {
        font-size: 13px;
        color: var(--hs-blue);
        text-decoration: none;
        display: flex;
        align-items: center;
        gap: 4px;
        cursor: pointer;
      }

      .chat-back:hover {
        text-decoration: underline;
      }

      .chat-header-name {
        font-family: "Outfit", sans-serif;
        font-size: 18px;
        font-weight: 600;
        color: var(--hs-dark);
      }

      .chat-header-phone {
        font-size: 13px;
        color: var(--hs-gray);
      }

      .chat-header-pill {
        display: inline-block;
        padding: 2px 10px;
        border-radius: 12px;
        font-size: 11px;
        font-weight: 600;
        line-height: 1.6;
      }

      .chat-reset {
        font-size: 12px;
        color: var(--hs-gray);
        background: var(--hs-white);
        border: 1px solid var(--hs-border);
        border-radius: 4px;
        padding: 4px 10px;
        cursor: pointer;
        transition: all 0.15s ease;
        margin-left: auto;
      }

      .chat-reset:hover {
        color: var(--hs-blue);
        border-color: var(--hs-blue);
      }

      /* ── Messages area ── */
      .messages {
        flex: 1;
        overflow-y: auto;
        padding: 24px;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      /* ── Message rows ── */
      .msg {
        display: flex;
        gap: 10px;
        max-width: 72%;
      }

      .msg.au {
        align-self: center;
        max-width: 85%;
      }

      .msg.cl {
        align-self: flex-start;
      }

      .msg.ac {
        align-self: flex-end;
        flex-direction: row-reverse;
      }

      .msg.caller {
        align-self: flex-end;
        flex-direction: row-reverse;
      }

      .msg.us {
        align-self: flex-end;
        flex-direction: row-reverse;
      }

      /* ── Message avatar ── */
      .msg-avatar {
        width: 30px;
        height: 30px;
        min-width: 30px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 11px;
        font-weight: 700;
        color: #ffffff;
      }

      .msg-avatar.au {
        background: var(--purple);
      }

      .msg-avatar.cl {
        background: var(--green);
      }

      .msg-avatar.ac {
        background: var(--blue);
      }

      .msg-avatar.caller {
        background: var(--orange);
      }

      .msg-avatar.us {
        background: var(--teal);
      }

      /* ── Message body ── */
      .msg-body {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }

      .msg-sender {
        font-size: 11px;
        font-weight: 600;
        margin-bottom: 2px;
      }

      .msg-sender.au {
        color: var(--purple);
      }

      .msg-sender.cl {
        color: var(--green);
      }

      .msg-sender.ac {
        color: var(--blue);
      }

      .msg-sender.caller {
        color: var(--orange);
      }

      .msg-sender.us {
        color: var(--teal);
      }

      .msg-bubble {
        padding: 12px 16px;
        border-radius: 12px;
        font-size: 13px;
        line-height: 1.7;
      }

      .msg-bubble.au {
        background: var(--purple-bg);
        border: 1px solid var(--purple-bd);
      }

      .msg-bubble.cl {
        background: var(--green-bg);
        border: 1px solid var(--green-bd);
      }

      .msg-bubble.ac {
        background: var(--blue-bg);
        border: 1px solid var(--blue-bd);
      }

      .msg-bubble.caller {
        background: var(--orange-bg);
        border: 1px solid var(--orange-bd);
      }

      .msg-bubble.us {
        background: var(--teal-bg);
        border: 1px solid var(--teal-bd);
      }

      .msg-meta {
        font-size: 10px;
        color: var(--hs-gray);
        font-family: "IBM Plex Mono", monospace;
      }

      /* ── Input area ── */
      .input-area {
        padding: 16px 24px;
        border-top: 1px solid var(--hs-border);
        background: var(--hs-white);
        display: flex;
        gap: 10px;
        align-items: flex-end;
      }

      .input-area textarea {
        flex: 1;
        font-size: 14px;
        font-family: "IBM Plex Sans", system-ui, sans-serif;
        padding: 10px 14px;
        border: 1px solid var(--hs-border);
        border-radius: 8px;
        resize: none;
        min-height: 42px;
        max-height: 120px;
        outline: none;
        transition:
          border-color 0.15s ease,
          box-shadow 0.15s ease;
      }

      .input-area textarea:focus {
        border-color: var(--hs-blue);
        box-shadow: 0 0 0 3px rgba(0, 145, 174, 0.12);
      }

      .input-area button {
        font-size: 13px;
        font-weight: 700;
        font-family: "IBM Plex Sans", system-ui, sans-serif;
        padding: 10px 20px;
        background: var(--teal);
        color: #ffffff;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        transition: background 0.15s ease;
      }

      .input-area button:hover {
        background: var(--t6);
      }

      /* ── Side panel (right) ── */
      .side-panel {
        width: 300px;
        min-width: 300px;
        border-left: 1px solid var(--hs-border);
        background: var(--hs-white);
        overflow-y: auto;
        display: flex;
        flex-direction: column;
      }

      .side-header {
        padding: 20px;
        border-bottom: 1px solid var(--hs-border);
        display: flex;
        gap: 12px;
        align-items: center;
      }

      .side-avatar {
        width: 44px;
        height: 44px;
        min-width: 44px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 16px;
        font-weight: 700;
        color: #ffffff;
        background: var(--hs-blue);
      }

      .side-name {
        font-family: "Outfit", sans-serif;
        font-size: 15px;
        font-weight: 600;
        color: var(--hs-dark);
      }

      .side-phone {
        font-size: 12px;
        color: var(--hs-gray);
      }

      .side-section {
        padding: 16px 20px;
        border-bottom: 1px solid var(--hs-border);
      }

      .side-section h4 {
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--hs-gray);
        margin-bottom: 10px;
      }

      .side-field {
        display: flex;
        justify-content: space-between;
        font-size: 13px;
        padding: 4px 0;
      }

      .side-field-label {
        color: var(--hs-gray);
      }

      .side-field-value {
        color: var(--hs-dark);
        font-weight: 500;
        text-align: right;
        max-width: 60%;
      }

      /* ── Checklist pips ── */
      .side-pips {
        display: flex;
        gap: 6px;
        align-items: center;
      }

      .side-pip {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--hs-border);
      }

      .side-pip.on {
        background: var(--hs-blue);
      }

      /* ── Notes ── */
      .side-notes {
        padding: 16px 20px;
        flex: 1;
        display: flex;
        flex-direction: column;
      }

      .side-notes h4 {
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--hs-gray);
        margin-bottom: 10px;
      }

      .side-notes textarea {
        flex: 1;
        min-height: 100px;
        font-size: 12px;
        font-family: "IBM Plex Sans", system-ui, sans-serif;
        padding: 10px;
        border: 1px solid var(--hs-border);
        border-radius: 6px;
        resize: none;
        outline: none;
        transition: border-color 0.15s ease;
      }

      .side-notes textarea:focus {
        border-color: var(--hs-blue);
      }

      /* ── Status pill variants ── */
      .status-pill-wr {
        background: #fef3cd;
        color: #856404;
      }

      .status-pill-r {
        background: #d4edda;
        color: #155724;
      }

      .status-pill-ready {
        background: var(--hs-blue-light);
        color: var(--hs-blue);
      }

      .status-pill-confirmed {
        background: #d1ecf1;
        color: #0c5460;
      }

      .status-pill-nc {
        background: #f8d7da;
        color: #721c24;
      }

      .status-pill-canceled {
        background: #e2e3e5;
        color: #6c757d;
      }

      .status-pill-blank {
        background: var(--s1);
        color: var(--s5);
      }

      /* ── Responsive ── */
      @media (max-width: 900px) {
        .side-panel {
          display: none;
        }

        .msg {
          max-width: 88%;
        }

        .msg.au {
          max-width: 95%;
        }

        .site-nav {
          padding: 0 16px;
        }

        .chat-header {
          padding: 12px 16px;
        }

        .messages {
          padding: 16px;
        }

        .input-area {
          padding: 12px 16px;
        }
      }
    </style>
  </head>

      /* ── Helpers ── */

      var COLORS = [
        "#e57373",
        "#7986cb",
        "#4db6ac",
        "#ff8a65",
        "#a1887f",
        "#9575cd",
        "#4fc3f7",
        "#81c784",
        "#ffb74d",
        "#f06292",
      ];

      function getContactId() {
        var params = new URLSearchParams(window.location.search);
        return params.get("id") || "";
      }

      function getContact(id) {
        try {
          var raw = localStorage.getItem("ac-hubspot-contacts");
          if (!raw) return null;
          var data = JSON.parse(raw);
          var contacts = data.contacts || [];
          for (var i = 0; i < contacts.length; i++) {
            if (contacts[i].id === id) return contacts[i];
          }
          return null;
        } catch (e) {
          return null;
        }
      }

      function getSaved(id) {
        try {
          var raw = localStorage.getItem("ac-convo-" + id);
          if (!raw) return { msgs: [], notes: "" };
          var data = JSON.parse(raw);
          return {
            msgs: data.msgs || [],
            notes: data.notes || "",
          };
        } catch (e) {
          return { msgs: [], notes: "" };
        }
      }

      function saveSent(id, text) {
        var saved = getSaved(id);
        saved.msgs.push({ text: text, time: new Date().toISOString() });
        localStorage.setItem("ac-convo-" + id, JSON.stringify(saved));
      }

      function saveNotes(id, notes) {
        var saved = getSaved(id);
        saved.notes = notes;
        localStorage.setItem("ac-convo-" + id, JSON.stringify(saved));
      }

      function resetConvo(id) {
        localStorage.removeItem("ac-convo-" + id);
        render();
      }

      function avatarColor(name) {
        var h = 0;
        for (var i = 0; i < name.length; i++)
          h = name.charCodeAt(i) + ((h << 5) - h);
        return COLORS[Math.abs(h) % COLORS.length];
      }

      function initials(first, last) {
        return (
          (first ? first[0].toUpperCase() : "") +
          (last ? last[0].toUpperCase() : "")
        );
      }

      function fmtDate(iso) {
        if (!iso) return "—";
        var d = new Date(iso);
        if (isNaN(d.getTime())) return "—";
        return d.toLocaleDateString("en-US", {
          month: "short",
          day: "numeric",
          year: "numeric",
          hour: "numeric",
          minute: "2-digit",
          hour12: true,
        });
      }

      function timeUntil(iso) {
        if (!iso) return "—";
        var d = new Date(iso);
        if (isNaN(d.getTime())) return "—";
        var now = new Date();
        var today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
        var target = new Date(d.getFullYear(), d.getMonth(), d.getDate());
        var diffMs = target.getTime() - today.getTime();
        var diffDays = Math.round(diffMs / 86400000);
        if (diffDays === 0) return "Today";
        if (diffDays === 1) return "1 day";
        if (diffDays > 1) return diffDays + " days";
        if (diffDays === -1) return "1 day ago";
        return Math.abs(diffDays) + " days ago";
      }

      function statusPillClass(status) {
        if (!status || status === "") return "status-pill-blank";
        if (status === "Waiting on Reply") return "status-pill-wr";
        if (status === "Responsive") return "status-pill-r";
        if (status === "Ready") return "status-pill-ready";
        if (status === "Confirmed") return "status-pill-confirmed";
        if (status === "Never Confirmed") return "status-pill-nc";
        if (status === "Canceled") return "status-pill-canceled";
        return "status-pill-blank";
      }

      /* ── Rendering ── */

      function renderHeader(contact) {
        var el = document.getElementById("chatHeader");
        el.textContent = "";

        var back = document.createElement("a");
        back.href = "contacts.html";
        back.className = "chat-back";
        back.textContent = "\u2190 Back to Contacts";
        el.appendChild(back);

        var name = document.createElement("span");
        name.className = "chat-header-name";
        name.textContent =
          (contact.firstName || "") + " " + (contact.lastName || "");
        el.appendChild(name);

        var phone = document.createElement("span");
        phone.className = "chat-header-phone";
        phone.textContent = contact.mobilePhone || "";
        el.appendChild(phone);

        var pill = document.createElement("span");
        pill.className =
          "chat-header-pill " +
          statusPillClass(contact.closingCallConfirmationStatus);
        pill.textContent = contact.closingCallConfirmationStatus || "No Status";
        el.appendChild(pill);

        var resetBtn = document.createElement("button");
        resetBtn.className = "chat-reset";
        resetBtn.textContent = "Reset";
        resetBtn.addEventListener("click", function () {
          resetConvo(getContactId());
        });
        el.appendChild(resetBtn);
      }

      function renderMessages(contact) {
        var messagesEl = document.getElementById("messages");
        messagesEl.textContent = "";

        var contactId = getContactId();
        var convoMsgs = CONVERSATIONS[contactId];

        if (!convoMsgs || convoMsgs.length === 0) {
          var empty = document.createElement("div");
          empty.style.cssText =
            "text-align:center;color:var(--hs-gray);padding:40px;font-size:14px;";
          empty.textContent = "No conversation yet. Send a message to start.";
          messagesEl.appendChild(empty);
        } else {
          var fullName =
            (contact.firstName || "") + " " + (contact.lastName || "");
          for (var i = 0; i < convoMsgs.length; i++) {
            var m = convoMsgs[i];
            messagesEl.appendChild(
              buildMessageEl(m.type, m.sender, m.text, m.time, contact),
            );
          }
        }

        // Append user-sent messages
        var saved = getSaved(contactId);
        for (var j = 0; j < saved.msgs.length; j++) {
          var sm = saved.msgs[j];
          var fmtTime = fmtDate(sm.time);
          messagesEl.appendChild(
            buildMessageEl("us", "You", sm.text, fmtTime, contact),
          );
        }

        messagesEl.scrollTop = messagesEl.scrollHeight;
      }

      function buildMessageEl(type, sender, text, time, contact) {
        var msg = document.createElement("div");
        msg.className = "msg " + type;

        var avatar = document.createElement("div");
        avatar.className = "msg-avatar " + type;

        if (type === "automated" || type === "au") {
          msg.className = "msg au";
          avatar.className = "msg-avatar au";
          avatar.style.background = "#89a0ab";
          avatar.textContent = "SYS";
        } else if (type === "cl") {
          var fullName =
            (contact.firstName || "") + " " + (contact.lastName || "");
          avatar.style.background = avatarColor(fullName);
          avatar.textContent = initials(contact.firstName, contact.lastName);
        } else if (type === "ac") {
          avatar.style.background = "#1565c0";
          avatar.textContent = "B";
        } else if (type === "caller") {
          avatar.style.background = "#e65100";
          avatar.textContent = "J";
        } else if (type === "us") {
          avatar.style.background = "#1e8f86";
          avatar.textContent = "You";
        }

        msg.appendChild(avatar);

        var body = document.createElement("div");
        body.className = "msg-body";

        var senderEl = document.createElement("div");
        var senderClass = type;
        if (type === "automated") senderClass = "au";
        senderEl.className = "msg-sender " + senderClass;
        senderEl.textContent = sender;
        body.appendChild(senderEl);

        var bubble = document.createElement("div");
        var bubbleClass = type;
        if (type === "automated") bubbleClass = "au";
        bubble.className = "msg-bubble " + bubbleClass;
        bubble.textContent = text;
        body.appendChild(bubble);

        var meta = document.createElement("div");
        meta.className = "msg-meta";
        meta.textContent = time;
        body.appendChild(meta);

        msg.appendChild(body);
        return msg;
      }

      function renderInput(contact) {
        var el = document.getElementById("inputArea");
        el.textContent = "";

        var textarea = document.createElement("textarea");
        textarea.placeholder = "Type your message...";
        textarea.rows = 1;

        textarea.addEventListener("input", function () {
          this.style.height = "auto";
          this.style.height = Math.min(this.scrollHeight, 120) + "px";

        textarea.addEventListener("keydown", function (e) {
          if (e.key === "Enter" && !e.shiftKey) {
            e.preventDefault();
            sendMessage();
          }

        var sendBtn = document.createElement("button");
        sendBtn.textContent = "Send";
        sendBtn.addEventListener("click", function () {
          sendMessage();
        });

        function sendMessage() {
          var val = textarea.value.trim();
          if (!val) return;
          saveSent(getContactId(), val);
          textarea.value = "";
          textarea.style.height = "auto";
          renderMessages(contact);
        }

        el.appendChild(textarea);
        el.appendChild(sendBtn);
      }

          var ntqSection = document.createElement("div");
          ntqSection.className = "side-section";

          var ntqH4 = document.createElement("h4");
          ntqH4.textContent = "NTQ Assessment";
          ntqSection.appendChild(ntqH4);

          var ntqField = createField("Score", contact.ntqPercentage + "%");
          ntqSection.appendChild(ntqField);

          el.appendChild(ntqSection);
        }

        // Notes
        var notesSection = document.createElement("div");
        notesSection.className = "side-notes";

        var notesH4 = document.createElement("h4");
        notesH4.textContent = "Notes";
        notesSection.appendChild(notesH4);

        var notesTA = document.createElement("textarea");
        notesTA.placeholder = "Add notes about this contact...";
        var savedData = getSaved(getContactId());
        notesTA.value = savedData.notes;

        var notesTimer = null;
        notesTA.addEventListener("input", function () {
          if (notesTimer) clearTimeout(notesTimer);
          notesTimer = setTimeout(function () {
            saveNotes(getContactId(), notesTA.value);
          }, 500);
        });

        notesSection.appendChild(notesTA);
        el.appendChild(notesSection);
      }

      function createField(labelText, valueText) {
        var row = document.createElement("div");
        row.className = "side-field";

        var label = document.createElement("span");
        label.className = "side-field-label";
        label.textContent = labelText;
        row.appendChild(label);

        var value = document.createElement("span");
        value.className = "side-field-value";
        value.textContent = valueText;
        row.appendChild(value);

        return row;
      }

      function render() {
        var id = getContactId();
        var contact = getContact(id);
        if (!contact) {
          window.location.href = "contacts.html";
          return;
        }
        renderHeader(contact);
        renderMessages(contact);
        renderInput(contact);
        renderSidebar(contact);
      }

      /* ── Init ── */
      (function () {
        var id = getContactId();
        if (!id) {
          window.location.href = "contacts.html";
          return;
        }
        var contact = getContact(id);
        if (!contact) {
          window.location.href = "contacts.html";
          return;
        }
        render();
      })();
    </script>
  </body>
</html>
